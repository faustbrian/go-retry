schema_version: 1
tool_version: v1.8.5
tool_checksums_sha256: 57f81a14b32fa629f9ed5c9cc6edc62c171095f5da6e36fa989dc12442fe1983
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/http
        - ./adapters/otel
        - ./adapters/postgres
        - ./adapters/slog
        - ./retryadapter
        - ./retryhttp
        - ./retrylog
        - ./retrypgx
        - ./retrytelemetry
operations:
  - module: .
    gate: test
    steps:
      - type: go-test
        packages: ["."]
        run: '^(TestNoPackageBackgroundWorkers|TestDoStrictStartsNoBackgroundWorkers)$'
        count: 10
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBackoffNeverProducesNegativeDelay$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPolicyValidationDoesNotAcceptContradictoryDelayBounds$'
        budget: 100000x
        timeout: 2m
      - type: go-test
        packages: ["./adapters/http"]
        fuzz: '^FuzzParseRetryAfterNeverReturnsNegativeDelay$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["./adapters/http"]
        fuzz: '^FuzzNewErrorBoundsResponseMetadata$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["./retryhttp"]
        fuzz: '^FuzzParseRetryAfterNeverReturnsNegativeDelay$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["."]
        benchmark: Benchmark
        budget: 100ms
        timeout: 20m
