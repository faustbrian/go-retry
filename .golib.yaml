schema_version: 1
tool_version: v1.0.5
tool_checksums_sha256: 7ee6c6c9bccd76cc1071fb891073055d393701abaed047e0357370f128ba771b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./retryadapter
        - ./retryhttp
        - ./retrylog
        - ./retrypgx
        - ./retrytelemetry
operations:
  - module: .
    gate: test
    steps:
      - type: go-test
        packages: ["."]
        run: '^TestNoPackageBackgroundWorkers$'
        count: 10
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBackoffNeverProducesNegativeDelay$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzPolicyValidationDoesNotAcceptContradictoryDelayBounds$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["./retryhttp"]
        fuzz: '^FuzzParseRetryAfterNeverReturnsNegativeDelay$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["."]
        benchmark: Benchmark
        budget: 100ms
        timeout: 20m
